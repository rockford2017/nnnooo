name: Run SelfBot Continuous

on:
  schedule:
    # هر ۴ ساعت یک‌بار اجرا می‌شود
    - cron: '0 */4 * * *'
  workflow_dispatch:

# این بخش باعث می‌شود اگر اجرای قبلی هنوز باز باشد، کلاً بسته شود تا تداخل پیش نیاید
concurrency:
  group: selfbot-execution
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyrogram tgcrypto

      - name: Run SelfBot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: |
          python main.py
